# ==============================================================================
# Nginx Configuration for Jesus Enthroned Church & Fahari Ledger Pro
# Main Website & Portal : jesusenthroned.org, www.jesusenthroned.org
# Accounting & ERP Portal: portal.jesusenthroned.org, porta.jesusenthroned.org
# Backend API (Django)   : 127.0.0.1:8000
# Portal Service (SSR)   : 127.0.0.1:3000
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. UPSTREAM DEFINITIONS
# ------------------------------------------------------------------------------
upstream django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream fahari_portal_ssr {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 2. MAIN WEBSITE & PORTAL: jesusenthroned.org & www.jesusenthroned.org
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jesusenthroned.org www.jesusenthroned.org;

    # Certbot ACME Challenge directory for SSL issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect HTTP to HTTPS once SSL certificate is active
    # (Uncomment the return below after running: certbot --nginx -d jesusenthroned.org -d www.jesusenthroned.org)
    # return 301 https://$host$request_uri;

    client_max_body_size 100M;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets collected by Django
    location /static/ {
        alias /var/www/jesusenthroned/jenc_backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # User Media Uploads (Avatars, Audio Sermons, Photos)
    location /media/ {
        alias /var/www/jesusenthroned/jenc_backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Django Admin Panel
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Django REST Framework API Endpoints
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;

        # CORS Support
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # React Frontend Single Page Application (jen_frontend/dist)
    location / {
        root /var/www/jesusenthroned/jen_frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # Caching for Vite static chunks
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/jesusenthroned/jen_frontend/dist;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ------------------------------------------------------------------------------
# 3. ACCOUNTING & ERP PORTAL: portal.jesusenthroned.org & porta.jesusenthroned.org
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name portal.jesusenthroned.org porta.jesusenthroned.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect HTTP to HTTPS once SSL certificate is active
    # (Uncomment the return below after running: certbot --nginx -d portal.jesusenthroned.org -d porta.jesusenthroned.org)
    # return 301 https://$host$request_uri;

    client_max_body_size 100M;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Reverse Proxy /api/ requests to Django Backend to eliminate CORS friction
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host jesusenthroned.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Media access on portal
    location /media/ {
        alias /var/www/jesusenthroned/jenc_backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Fahari Ledger Pro Service (SSR or Vite Preview on port 3000) with fallback to static dist
    location / {
        proxy_pass http://fahari_portal_ssr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Fallback to static client build if SSR service is restarting
        proxy_intercept_errors on;
        error_page 502 503 504 = @static_fallback;
    }

    location @static_fallback {
        root /var/www/jesusenthroned/fahari-ledger-pro/dist/client;
        try_files $uri $uri/ /index.html;
    }

    # Caching for Fahari static assets
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/jesusenthroned/fahari-ledger-pro/dist/client;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri @ssr_asset_fallback;
    }

    location @ssr_asset_fallback {
        proxy_pass http://fahari_portal_ssr;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

