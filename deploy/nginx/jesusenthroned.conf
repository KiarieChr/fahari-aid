# ==============================================================================
# Nginx Configuration for Jesus Enthroned Church & Fahari Ledger Pro
# Main Website & Portal : jesusenthroned.org, www.jesusenthroned.org
# Accounting & ERP Portal: portal.jesusenthroned.org, porta.jesusenthroned.org
# Backend API (Django)   : 127.0.0.1:8000
# Portal Service (SSR)   : 127.0.0.1:3000
# ==============================================================================

upstream jenc_django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream jenc_portal_ssr {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS REDIRECT (jesusenthroned.org & www)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jesusenthroned.org www.jesusenthroned.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS MAIN WEBSITE & MEMBER PORTAL (jesusenthroned.org & www)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jesusenthroned.org www.jesusenthroned.org;

    # SSL Certificates issued by Certbot Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/jesusenthroned.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jesusenthroned.org/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 100M;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets collected by Django
    location /static/ {
        alias /var/www/jesusenthroned/jenc_backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # User Media Uploads (Avatars, Audio Sermons, Photos)
    location /media/ {
        alias /var/www/jesusenthroned/jenc_backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Django Admin Panel
    location /admin/ {
        proxy_pass http://jenc_django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Django REST Framework API Endpoints
    location /api/ {
        proxy_pass http://jenc_django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;

        # CORS Support
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # React Frontend Single Page Application (jen_frontend/dist)
    location / {
        root /var/www/jesusenthroned/jen_frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # Caching for Vite static chunks
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/jesusenthroned/jen_frontend/dist;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ------------------------------------------------------------------------------
# 3. HTTP -> HTTPS REDIRECT (portal.jesusenthroned.org)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name portal.jesusenthroned.org porta.jesusenthroned.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 4. HTTPS ACCOUNTING & ERP PORTAL (portal.jesusenthroned.org)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.jesusenthroned.org porta.jesusenthroned.org;

    # SSL Certificates issued by Certbot Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/portal.jesusenthroned.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.jesusenthroned.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 100M;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location /api/ {
        proxy_pass http://jenc_django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host jesusenthroned.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    location /media/ {
        alias /var/www/jesusenthroned/jenc_backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Fahari Ledger Pro Service (port 3000) with fallback to static dist
    location / {
        proxy_pass http://jenc_portal_ssr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @static_fallback;
    }

    location @static_fallback {
        root /var/www/jesusenthroned/fahari-ledger-pro/dist/client;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/jesusenthroned/fahari-ledger-pro/dist/client;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri @ssr_asset_fallback;
    }

    location @ssr_asset_fallback {
        proxy_pass http://jenc_portal_ssr;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
