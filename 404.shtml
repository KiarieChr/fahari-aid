<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - 404 Error</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            line-height: 1.6;
        }
        
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        
        .error-illustration {
            width: 300px;
            height: 200px;
            margin: 0 auto 2rem;
            background-color: #e9ecef;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #6c757d;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #dc3545;
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        
        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: #0056b3;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }
            
            .error-illustration {
                width: 200px;
                height: 150px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-illustration">
            <!-- Replace this with your actual illustration -->
            <svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
                <rect width="200" height="150" fill="#e9ecef"/>
                <path d="M50 50 L150 50 L150 100 L50 100 Z" fill="none" stroke="#6c757d" stroke-width="2"/>
                <path d="M60 60 L90 90 M90 60 L60 90" stroke="#dc3545" stroke-width="3"/>
                <path d="M110 60 L140 90 M140 60 L110 90" stroke="#dc3545" stroke-width="3"/>
                <text x="100" y="130" text-anchor="middle" font-size="14" fill="#6c757d">404 Illustration</text>
            </svg>
        </div>
        
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>We couldn't find the page you were looking for. It might have been moved or deleted.</p>
        <a href="/" class="btn">Return to Homepage</a>
    </div>
</body>
</html>
